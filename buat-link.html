<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pembuat Link Undangan</title>
<style>
body{font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 18px;color:#2b2b2b}
input,button,textarea{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #ccc;width:100%;box-sizing:border-box;margin:6px 0}
button{background:#b4637a;color:#fff;border:0;cursor:pointer}
.out{background:#f6f1f3;padding:12px;border-radius:10px;word-break:break-all;margin-top:10px}
</style></head><body>
<h2>Pembuat Link Undangan</h2>
<label>Alamat undangan (setelah online)</label>
<input id="base" placeholder="https://nama-kamu.netlify.app/">
<label>Nama tamu (satu nama per baris)</label>
<textarea id="names" rows="6" placeholder="Nur Zahra &amp; Pasangan&#10;Keluarga Bapak Budi"></textarea>
<button onclick="gen()">Buat Link</button>
<div id="res"></div>
<script>
function gen(){
  let base=document.getElementById('base').value.trim();
  if(!base){alert('Isi alamat undangan dulu');return}
  base=base.split('?')[0];
  const res=document.getElementById('res');res.innerHTML='';
  document.getElementById('names').value.split('\n').map(n=>n.trim()).filter(Boolean).forEach(n=>{
    const url=base+'?to='+encodeURIComponent(n).replace(/%20/g,'+');
    const d=document.createElement('div');d.className='out';
    d.innerHTML='<b></b><br><span></span><br><a target="_blank">Buka</a> · <a href="#">Salin</a> · <a href="#">WhatsApp</a>';
    d.querySelector('b').textContent=n;d.querySelector('span').textContent=url;
    const a=d.querySelectorAll('a');
    a[0].href=url;
    a[1].onclick=e=>{e.preventDefault();navigator.clipboard.writeText(url);a[1].textContent='Tersalin ✓'};
    a[2].href='https://wa.me/?text='+encodeURIComponent('Kepada Yth. '+n+', dengan hormat kami mengundang Anda ke pernikahan kami: '+url);
    a[2].target='_blank';
    res.appendChild(d);
  });
}
</script></body></html>
